# ============================================================================
#  honam.newtamsa.org — nginx 서버 블록
#  newtamsa.org 와 같은 서버(Ubuntu/nginx)에 서브도메인으로 추가하는 설정.
#  배포 산출물(dist/*) 을 /var/www/honam 에 올린 뒤 사용.
#  설치: /etc/nginx/sites-available/honam.newtamsa.org.conf 에 저장 →
#        ln -s ../sites-available/honam.newtamsa.org.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#  SSL: certbot --nginx -d honam.newtamsa.org  (아래 443 블록 자동 추가됨)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name honam.newtamsa.org;

    root /var/www/honam;
    index index.html;

    # 정적 단일 페이지 — 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 파일명 에셋은 장기 캐시 (Vite 빌드 결과)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 은 캐시하지 않음(배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 기본 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
